name: RailGuard Vision Cloud API CI

on:
  push:
    branches: [main, repair/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application modules
        run: |
          python -m compileall app src

      - name: Acceptance test - Application startup
        run: |
          python -c "from app.api import app; print(f'App initialized successfully: {app.title}')"

      - name: Run unit and integration tests
        run: |
          pytest -q
